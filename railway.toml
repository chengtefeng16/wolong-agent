# ================================================================
# Railway 部署配置 — 卧龙 Agent 系统
# 单服务架构：Python API + 静态 H5（Vite build）
# ================================================================

[build]
# nixpacks.toml 负责安装 Python + Node 并构建 H5
# buildCommand 这里留空让 nixpacks 接管

[deploy]
# Railway 注入 $PORT，Python 服务监听它
startCommand = "python3 scripts/api_server.py"

# 健康检查
healthcheckPath = "/api/status"
healthcheckTimeout = 30

# 自动重启
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
