name: Daily Short Video Upload

on:
  schedule:
    - cron: '0 12 * * 2,4,6'
    - cron: '0 1 * * 0'
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: short_video_agent
        run: pip install -r requirements.txt

      - name: Restore config files from secrets
        working-directory: short_video_agent
        run: |
          echo "${{ secrets.YOUTUBE_CREDENTIALS }}" | base64 -d > config/youtube_credentials.json
          echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 -d > config/youtube_token.json
          echo "${{ secrets.GSHEETS_CREDENTIALS }}" | base64 -d > config/gsheets_credentials.json

      - name: Update API keys in config
        working-directory: short_video_agent
        run: |
          sed -i "s|gemini_key:.*|gemini_key: \"${{ secrets.GEMINI_KEY }}\"|" config/base_config.yaml
          sed -i "s|elevenlabs_key:.*|elevenlabs_key: \"${{ secrets.ELEVENLABS_KEY }}\"|" config/base_config.yaml

      - name: Run full pipeline
        working-directory: short_video_agent
        run: python main.py --produce

      - name: Upload to YouTube and update history
        working-directory: short_video_agent
        run: |
          VIDEO=$(ls -t output/video_*.mp4 | head -1)
          SCRIPT=$(ls -t output/script_*.json | head -1)
          python - <<PYEOF
          import sys, json, os
          from datetime import datetime
          sys.path.insert(0, '.')
          from modules.config_loader import load_config
          from modules.youtube_uploader import YouTubeUploader
          cfg = load_config()
          script_path = '$SCRIPT'
          video_path = '$VIDEO'
          script_data = json.load(open(script_path))
          uploader = YouTubeUploader(cfg)
          video_id = uploader.upload(video_path, script_data)
          history_path = 'history.json'
          history = json.load(open(history_path)) if os.path.exists(history_path) else []
          history.insert(0, {
              'video_id': video_id,
              'title': script_data.get('title', ''),
              'published_at': datetime.now().isoformat(),
              'status': 'success',
              'url': f'https://youtu.be/{video_id}',
              'tags': script_data.get('tags', []),
          })
          json.dump(history, open(history_path, 'w'), ensure_ascii=False, indent=2)
          print(f'Done: https://youtu.be/{video_id}')
          PYEOF

      - name: Push history.json to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add short_video_agent/history.json
          git diff --staged --quiet || git commit -m "update history.json [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
