# ====================================================

# 当前激活的内容方向配置
content_config: "buddhism_zh"

# API Keys
api:
  gemini_key: "AIzaSyA1Uf-0Mz1-MlcLGqJ-sAgkLmBqc-YQK6Q"
  elevenlabs_key: "sk_2ca0bca9c826a7b7b9a5b68d9fa4737f57deedf2b99deb0d"
  # vrip4LPxKN0LbhJ62533 是克隆音色需要付费升级，暂用 Sarah (premade, 支持中文multilingual)
