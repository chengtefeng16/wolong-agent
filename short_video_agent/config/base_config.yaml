# ====================================================
# 短视频Agent - 基础配置
# 切换垂直方向只需改 content_config 指向的文件
# ====================================================

# 当前激活的内容方向配置
content_config: "buddhism_zh"

# API Keys
api:
  gemini_key: ""       # 留空，从环境变量 GEMINI_KEY 读取
  youtube_api_key: "AIzaSyAYCnhciu1eqycM1o7hCo1W2xJECP0DR1k"
  elevenlabs_key: ""   # 留空，从环境变量 ELEVENLABS_KEY 读取
  # vrip4LPxKN0LbhJ62533 是克隆音色需要付费升级，暂用 Sarah (premade, 支持中文multilingual)
  elevenlabs_voice_id: "zh-CN-YunjianNeural"
  # YouTube OAuth credentials path (需要单独配置)
  youtube_credentials: "config/youtube_credentials.json"
  youtube_token: "config/youtube_token.json"
  # Google Sheets Service Account (需要单独配置)
  gsheets_credentials: "config/gsheets_credentials.json"

# 视频规格
video:
  width: 1080
  height: 1920          # 9:16 竖屏
  fps: 30
  background_color: [15, 15, 25]  # 深夜蓝黑色

# 字幕样式
subtitle:
  font_size: 72
  line_height: 1.5
  max_chars_per_line: 12   # 中文每行最多字数
  color: [255, 255, 255]
  shadow_color: [0, 0, 0]
  shadow_offset: 3
  padding_bottom: 180      # 距底部像素

# 输出
output:
  dir: "output"
  keep_temp: false          # 是否保留中间临时文件
