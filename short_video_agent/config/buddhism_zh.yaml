# ====================================================
# 内容方向配置：佛学/情绪安住（海外华人）
# 换垂直领域时，复制此文件并修改以下字段
# ====================================================

direction_name: "佛学情绪安住"
target_audience: "海外华人，面临文化冲突、孤独感、职场压力，对传统智慧有一定接受度"
content_style: "温柔、有力量感、直击内心，不说教，用故事和比喻"
language: "zh-en"  # zh | en | zh-en (双语)
elevenlabs_voice_id: "zh-CN-YunjianNeural"  # Sarah — premade，支持中文multilingual

# Google Sheet 素材库
google_sheet:
  # 从 Sheet URL 提取 spreadsheet_id
  # 例: https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms/edit
  spreadsheet_id: "1rC0T5Jmo5Th2KYqiNCa7Z3c510dOVkt3NQNLc_76hVk"
  worksheet_name: "素材库"
  # 列映射
  columns:
    source_text: "D"      # segment_text — 讲义原文段落
    theme: "E"            # tags — 情绪/主题标签（如：失眠,焦虑）
    difficulty: "C"       # segment_id（暂用，后续可加深度字段）
    used: "F"             # 暂无此列，留空则所有素材均为未用状态

# 脚本生成 Prompt（单次调用直出完整口播稿）
script_prompt: |
  你是一位制作面向海外华人的佛法情绪短视频创作者。
  风格：温柔、有力量感，像朋友聊天，不说教，不用佛教术语说教。
  目标受众：{target_audience}

  基于以下讲义素材，生成一个60秒完整口播视频脚本：

  【素材】
  {source_material}

  【脚本结构】
  1. 开场钩子（约15字）：直击受众痛点，让人立刻停下来
  2. 佛法智慧（约60字）：用现代语言+比喻重新表达素材核心，不照搬原文
  3. 30秒练习（约80字）：今天就能做的具体行动，给出明确步骤
  4. 收尾CTA（约15字）：温柔收尾，引导点赞/关注

  【格式要求】
  - 全程用逗号停顿，少用句号（更适合TTS朗读节奏）
  - 总字数150-180字（对应Sarah语速约60秒）
  - 不用"佛法说""经云"等引导语，直接讲
  - 不要分段标注，直接输出连贯口播稿

  请严格按以下JSON格式输出，不要添加任何额外文字：
  {{
    "title": "（12字以内，有情感钩子，让人想点进来）",
    "cover_quote": "（一句话金句，让人想截图转发）",
    "full_script": "（完整口播稿，150-180字，口语化，逗号停顿）",
    "tags": ["标签1", "标签2", "标签3"]
  }}

# YouTube 发布设置
youtube:
  category_id: "22"        # People & Blogs
  default_language: "zh-Hans"
  privacy: "public"   # 首次上传私密，确认效果后手动改为 public
  title_template: "{title} | 佛法与生活"
  description_template: |
    {cover_quote}

    📿 这一期，我们聊聊{theme}。

    如果你也在海外打拼，偶尔感到疲惫、迷茫——
    希望这段话能陪着你。

    ✨ 今天就试试视频里的练习，把感受写在评论区，我看到每一条。

    👉 关注频道，每周更新佛法与生活的小思考。

    #佛法 #情绪安住 #海外华人 #心灵成长 #正念 #{theme}
  tags:
    - "佛法"
    - "冥想"
    - "情绪管理"
    - "海外华人"
    - "心灵成长"
    - "正念"
