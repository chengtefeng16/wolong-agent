# ====================================================
# 内容方向配置：佛学/情绪安住（海外华人）
# 换垂直领域时，复制此文件并修改以下字段
# ====================================================

direction_name: "佛学情绪安住"
target_audience: "海外华人，面临文化冲突、孤独感、职场压力，对传统智慧有一定接受度"
content_style: "温柔、有力量感、直击内心，不说教，用故事和比喻"
language: "zh-en"  # zh | en | zh-en (双语)
elevenlabs_voice_id: "vrip4LPxKN0LbhJ62533"  # Sarah — premade，支持中文multilingual

# 钩子形式库 — 每次生成随机抽一种，避免同质化
# 调性要求：贴合"海外华人·佛学情绪安住"的温柔有力风格，不油腻，不焦虑贩卖
hook_styles:
  - name: "痛点反问"
    desc: "用一个精准的问句，戳中海外华人某个具体处境或隐秘情绪，让人觉得'说的就是我'"
    example: "是不是越努力，反而越觉得自己不够好？"

  - name: "场景白描"
    desc: "描述一个具体的画面或动作，留下悬念，不交代原因和结果"
    example: "昨晚有个人盯着手机屏幕坐了两个小时，什么都没做"

  - name: "对话体"
    desc: "引述某人说的一句话，让人想知道说话的语境和后续"
    example: "她问我：你来这里，到底图什么？"

  - name: "反常识"
    desc: "推翻一个大家默认的想法，但只给结论，不给原因，制造必须听完的悬念"
    example: "越想让自己冷静，其实越难冷静，原因只有一个"

  - name: "时间锚点"
    desc: "用一个具体时间节点开头，给人代入感，暗示那个时刻有事发生"
    example: "凌晨两点，我看了眼存款，然后关上了手机"

  - name: "直呼命令"
    desc: "用一句温柔的命令或请求直接呼唤，制造亲密感和停顿"
    example: "停一下，就停一下，不用做任何事"

  - name: "自白坦白"
    desc: "用第一人称坦白一件事，语气像在跟老朋友说悄悄话"
    example: "说件我没跟人讲过的事——我有次在超市里哭了"

  - name: "生活物件起兴"
    desc: "用一件日常物品的状态或动作，引出一个人生道理，不直接说道理"
    example: "一杯水，放在那里，它不急"

  - name: "倒叙"
    desc: "先抛出一个结果或行动，再回头讲为什么，制造信息缺口"
    example: "那条消息我发出去之后，就把他删了，我想说说为什么"

  - name: "一句钝的真话"
    desc: "一句短、直、不加修饰的话，像一块石头扔进水里，简单有力"
    example: "撑着，是一种病"

  - name: "数字锚定"
    desc: "用一个具体数字制造真实感，暗示经历有积累、有重量"
    example: "在国外的第1826天，我才想明白一件事"

  - name: "对比落差"
    desc: "把别人眼中的自己和真实的自己并排放，制造反差和认同"
    example: "别人觉得我过得不错，昨晚我一个人吃了两碗泡面"

  - name: "偷听目击"
    desc: "描述无意间听到或看到的一个场景，制造窥探感和好奇"
    example: "上周我在咖啡馆偷听到两个陌生人的对话，其中一句让我愣住了"

  - name: "角色反转"
    desc: "说出一个出人意料的身份翻转，让人想知道怎么发生的"
    example: "我以为我是那个需要被帮助的人，结果不是"

  - name: "意外发现"
    desc: "描述一个偶然翻出或遇见的东西，用它打开话题"
    example: "上周收拾房间，翻出一张三年前写给自己的纸条"

  - name: "残缺结尾引入"
    desc: "以一个没有说完的想法开场，像是思绪被什么打断，让人想接上"
    example: "那句话，我最终没有说出口，一直到现在"

  - name: "第三方故事"
    desc: "引出一个具体的人的处境，不立刻点明结局，让人为那个人担心"
    example: "我认识一个人，在国外住了十年，上个月突然回去了，临走说了一句话"

  - name: "身体感受"
    desc: "描述一种说不清楚但很多人有过的身体或情绪感觉，让人对号入座"
    example: "那种感觉，就是胸口有什么东西，说不出来，但就是在"

