# ====================================================
# CNcar 内容方向配置：汽车进口落地成本
# 面向海湾地区（UAE/Saudi/Oman 等）中文/英文受众
# ====================================================

direction_name: "CNcar汽车进口"
target_audience: "海湾地区有购车意向的消费者，关注中国新能源车进口落地价格"
language: "en"   # en | ar | en-ar (双语)
elevenlabs_voice_id: "en-US-ChristopherNeural"  # edge-tts deep male EN; AR fallback: ar-AE-HamdanNeural

# Google Sheet 素材库（工作表2）
google_sheet:
  spreadsheet_id: "1rC0T5Jmo5Th2KYqiNCa7Z3c510dOVkt3NQNLc_76hVk"
  worksheet_name: "工作表2"
  recent_themes_count: 3
  # 列映射（A-H）
  columns:
    car_model:        "A"
    destination:      "B"
    landed_cost_usd:  "C"
    report_url:       "D"
    copy_en:          "E"   # 预填则直接用，空则 AI 生成
    copy_ar:          "F"   # 预填则直接用，空则 AI 生成（暂不生成，留 Step 4）
    cover_prompt:     "G"
    used:             "H"   # 已用日期 YYYY-MM-DD，空=未用

# 封面生成配置
cover:
  # 钩子问句：按语言分组，seed 轮换选一条
  hook_lines:
    - "Real landed cost 👇"
    - "Profit or loss?"
    - "True cost revealed"
    - "Is this deal worth it?"
  hook_lines_ar:          # 预留阿语扩展位（Step 4 填充）
    - "التكلفة الحقيقية 👇"
  brightness_min: 90      # 0-255；低于此丢弃重抓（可微调）
  brightness_retries: 5   # 最多重抓次数，超出取最亮那张

# CNcar YouTube 凭证（独立于定心，待配置）
youtube_credentials: "cncar/config/cncar_youtube_credentials.json"
youtube_token:       "cncar/config/cncar_youtube_token.json"

# YouTube 发布设置
youtube:
  category_id: "2"          # Autos & Vehicles
  default_language: "en"
  privacy: "unlisted"        # 人工审核通过后改为 public
  title_template: "{title} | CNcar"
  description_template: |
    👉 See the full landed-cost report: {report_url}

    Real landed cost from China, all-in. No surprises at the port.

    import car from China | landed cost calculator | used car export | vehicle import duty
    #ImportCarFromChina #CarExport #LandedCost #UsedCarImport #CNcar
  tags:
    - "Chinese EV"
    - "car import"
    - "landed cost"
    - "UAE"
    - "BYD"
    - "CNcar"

# 脚本生成 Prompt（当 copy_en 为空时调用）
script_prompt: |
  You are a short-video script writer for CNcar, a platform that helps Gulf-region buyers
  understand the real cost of importing Chinese cars (BYD, Chery, GAC, etc.).

  Your tone: direct, informative, like a knowledgeable friend — not a salesperson.
  Target: someone already considering buying a Chinese EV and wants to know the REAL price.

  Given this car data:
  - Car model: {car_model}
  - Destination country: {destination}
  - Landed cost estimate (USD): {landed_cost_usd}
  - Full report: {report_url}

  Write a 25–30 second English video script (60–80 words TOTAL). Structure:

  1. HOOK — sentence #1 only. RULES (non-negotiable):
     • Lead with the GAP between what buyers expect and reality — the "quoted price vs real cost" shock.
     • Must contain a specific dollar number AND a contrast or surprise. No warm-up. No scene-setting.
     ✅ "The dealer quoted $22,000. It landed at $29,473. Here's every dollar in between."
     ✅ "$27,850 to land this car. The dealer's price? $21,000. Know the gap before you wire."
     ❌ "Thinking about importing a BYD?" (too soft — BANNED)
     ❌ "A dealer bought a car and shipped it..." (scene-setting — BANNED)

  2. CORE — 35–45 words. Reveal the real cost gap: what the buyer expected vs what actually landed.
     Use ONE or TWO specific cost drivers (duty %, VAT, freight) — not a checklist of every fee.
     Build tension: each line adds to the "no one told you this" feeling.
     Short sentences, max 12 words each.

  3. ENDING HOOK — 1 sentence, 10–12 words. Lead viewers to CNcar to see their own numbers.
     Frame as "see for yourself / know before you commit" — NOT "we recommend / protect yourself".
     ✅ "See the full breakdown at CNcar.io before you decide."
     ✅ "Know your real number at CNcar.io."
     ❌ "Get your free report at CNcar." (sounds like a sales CTA — BANNED)
     ❌ "CNcar recommends..." (we don't recommend products — BANNED)

  HARD RULES:
  - 60–80 words TOTAL. Hard cap — count them.
  - Every sentence ≤ 12 words.
  - Zero filler: no "basically", "actually", "as you know", "in today's video".
  - Functional persuasion only — facts, gaps, numbers. Not emotion.
  - Do NOT name specific dealers or individuals.

  Output strict JSON:
  {{
    "title": "(under 10 words, hook-style, e.g. 'BYD Han Landed in Dubai: Full Cost')",
    "cover_quote": "(one punchy sentence for the thumbnail, under 15 words)",
    "full_script": "(complete script, 60-80 words)",
    "tags": ["tag1", "tag2", "tag3"]
  }}
