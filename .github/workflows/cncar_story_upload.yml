name: CNcar Story Upload

on:
  workflow_dispatch:  # 仅手动触发（本地已用 launchd 每日 07:00 自动生成）
    inputs:
      story_file:
        description: '手动指定 story 文件路径（留空则 Gemini 自动生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        working-directory: short_video_agent
        run: pip install -r requirements.txt

      - name: Restore CNcar YouTube credentials
        working-directory: short_video_agent
        run: |
          mkdir -p cncar/config
          echo "${{ secrets.CNCAR_YOUTUBE_CREDENTIALS }}" | base64 -d > cncar/config/cncar_youtube_credentials.json
          echo "${{ secrets.CNCAR_YOUTUBE_TOKEN }}" | base64 -d > cncar/config/cncar_youtube_token.json

      - name: Run story pipeline
        id: story
        working-directory: short_video_agent
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -eo pipefail
          MANUAL="${{ github.event.inputs.story_file }}"
          if [ -n "$MANUAL" ]; then
            echo "使用手动指定故事文件: $MANUAL"
            python3 cncar/main.py --story "$MANUAL" 2>&1 | tee /tmp/story_log.txt
          else
            echo "Gemini 自动生成故事脚本..."
            python3 cncar/main.py --auto-story 2>&1 | tee /tmp/story_log.txt
          fi
          VIDEO_ID=$(python3 -c "
          import json
          data = json.load(open('cncar/pending.json'))
          pending = [x for x in data if x.get('status') == 'pending']
          print(pending[-1]['id'])
          ")
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          echo "生成完成，ID: $VIDEO_ID"

      - name: Print pending summary (no auto-upload)
        run: |
          echo "=========================================="
          echo "⏳ 视频已生成，等待人工审核后手动 approve"
          echo "ID: ${{ steps.story.outputs.video_id }}"
          echo "本地运行: python3 cncar/main.py --approve ${{ steps.story.outputs.video_id }}"
          echo "=========================================="
