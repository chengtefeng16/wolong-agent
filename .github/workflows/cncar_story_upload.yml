name: CNcar Story Upload

on:
  schedule:
    - cron: "0 23 * * *"   # 每天 23:00 UTC = 北京时间 07:00
  workflow_dispatch:
    inputs:
      story_file:
        description: 'Story file path (留空则自动选下一个未用文件)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        working-directory: short_video_agent
        run: pip install -r requirements.txt

      - name: Restore CNcar YouTube credentials
        working-directory: short_video_agent
        run: |
          mkdir -p cncar/config
          echo "${{ secrets.CNCAR_YOUTUBE_CREDENTIALS }}" | base64 -d > cncar/config/cncar_youtube_credentials.json
          echo "${{ secrets.CNCAR_YOUTUBE_TOKEN }}" | base64 -d > cncar/config/cncar_youtube_token.json

      - name: Pick story file
        id: pick
        working-directory: short_video_agent
        run: |
          MANUAL="${{ github.event.inputs.story_file }}"
          if [ -n "$MANUAL" ]; then
            echo "story_file=$MANUAL" >> $GITHUB_OUTPUT
            echo "使用手动指定: $MANUAL"
          else
            python3 - << 'PYEOF'
          import json, os, glob, sys
          from pathlib import Path

          stories = sorted(glob.glob("cncar/stories/story_*.txt"))
          if not stories:
              print("❌ 没有找到 story 文件", file=sys.stderr)
              sys.exit(1)

          # 读已上传过的故事文件列表
          used = set()
          if os.path.exists("cncar/pending.json"):
              for entry in json.load(open("cncar/pending.json")):
                  if entry.get("source") == "story" and entry.get("status") in ("approved", "uploaded"):
                      sf = entry.get("story_file", "")
                      if sf:
                          used.add(sf)

          # 选第一个未用过的
          chosen = None
          for s in stories:
              if s not in used:
                  chosen = s
                  break

          if chosen is None:
              # 全部用过了，从头轮
              chosen = stories[0]
              print(f"所有故事已轮完，从头开始: {chosen}")
          else:
              print(f"选中: {chosen}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"story_file={chosen}\n")
          PYEOF
          fi

      - name: Run story pipeline (TTS + Pexels + 合成 + BGM)
        id: story
        working-directory: short_video_agent
        run: |
          set -eo pipefail
          python3 cncar/main.py --story "${{ steps.pick.outputs.story_file }}" 2>&1 | tee /tmp/story_log.txt
          VIDEO_ID=$(python3 -c "
          import json
          data = json.load(open('cncar/pending.json'))
          pending = [x for x in data if x.get('status') == 'pending']
          print(pending[-1]['id'])
          ")
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          echo "生成完成，ID: $VIDEO_ID"

      - name: Upload to YouTube (unlisted)
        id: upload
        working-directory: short_video_agent
        run: |
          python3 cncar/main.py --approve "${{ steps.story.outputs.video_id }}" 2>&1 | tee /tmp/upload_log.txt
          VIDEO_URL=$(grep -oP "youtu\.be/[a-zA-Z0-9_-]+" /tmp/upload_log.txt | head -1)
          echo "video_url=https://$VIDEO_URL" >> $GITHUB_OUTPUT

      - name: Print result
        run: |
          echo "=========================================="
          echo "✅ 上传完成（unlisted，审核后手动转公开）"
          echo "📄 故事: ${{ steps.pick.outputs.story_file }}"
          echo "🔗 ${{ steps.upload.outputs.video_url }}"
          echo "=========================================="
